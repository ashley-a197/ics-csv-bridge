[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ics-csv-bridge"
version = "0.1.0"
description = "Convert calendar events between iCalendar (.ics) and CSV, with precise error locations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ashley-a197" }]

[project.scripts]
icsbridge = "icsbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
